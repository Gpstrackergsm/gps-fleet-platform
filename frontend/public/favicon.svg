<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Cyan/Blue Energy Gradient -->
    <linearGradient id="neonCyan" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#6366F1" />
    </linearGradient>

    <!-- Radar Pulse Gradient -->
    <radialGradient id="radarGlow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.35" />
      <stop offset="60%" stopColor="#3B82F6" stopOpacity="0.12" />
      <stop offset="100%" stopColor="#020617" stopOpacity="0" />
    </radialGradient>

    <!-- Amber Alert/Pulse -->
    <linearGradient id="accentAmber" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Radar / Geofence Field Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#radarGlow)" />

  <!-- Outer Concentric Geofence Boundary (Dashed Tech Ring) -->
  <circle cx="256" cy="256" r="180" stroke="#06B6D4" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.4" />
  
  <!-- Middle Geofence Ring -->
  <circle cx="256" cy="256" r="130" stroke="#3B82F6" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Outer Hexagonal Tech Boundary Shield (The "Fence") -->
  <polygon points="256,76 396,156 396,356 256,436 116,356 116,156" 
           stroke="url(#neonCyan)" stroke-width="8" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Hexagon Corner Pins (Nodes) -->
  <circle cx="256" cy="76" r="8" fill="#06B6D4" />
  <circle cx="396" cy="156" r="8" fill="#3B82F6" />
  <circle cx="396" cy="356" r="8" fill="#6366F1" />
  <circle cx="256" cy="436" r="8" fill="#3B82F6" />
  <circle cx="116" cy="356" r="8" fill="#06B6D4" />
  <circle cx="116" cy="156" r="8" fill="#06B6D4" />

  <!-- Center Target Core (GPS Location Target) -->
  <circle cx="256" cy="256" r="64" fill="#0F172A" stroke="url(#neonCyan)" stroke-width="6" />

  <!-- Center GPS Pin Icon -->
  <path d="M256 196 C238.3 196 224 210.3 224 228 C224 250 256 288 256 288 C256 288 288 250 288 228 C288 210.3 273.7 196 256 196 Z" 
        fill="url(#neonCyan)" />
  <circle cx="256" cy="226" r="9" fill="#0B132B" />

  <!-- Signal / Satellite Waves radiating from top of pin -->
  <path d="M232 178 C246 168 266 168 280 178" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M220 162 C242 148 270 148 292 162" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
</svg>
